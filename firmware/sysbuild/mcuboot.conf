# MCUboot with serial recovery over USB CDC ACM.
#
# On reset MCUboot waits BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT ms for an mcumgr
# connection on the USB-C port before booting the application, which is what
# makes USB-only firmware updates possible on a module that has no factory
# bootloader.

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Smart Shelf Bootloader"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y

# The bootloader has only one CDC ACM instance, and mcumgr owns it. A console on
# the same instance would interleave log output with the recovery protocol, so
# serial_adapter.c refuses to build in that case. Logging happens in the
# application, not here.
CONFIG_UART_CONSOLE=n

CONFIG_BOOT_MAX_IMG_SECTORS=256

# This board has no 32.768 kHz crystal (module XL1/XL2 unconnected). The DK
# board files default to XTAL; with no crystal fitted LFCLKSTARTED never fires
# and the system clock init blocks forever, so MCUboot hangs before it can bring
# up USB. Must match prj.conf.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
