# Console over SEGGER RTT instead of USB CDC ACM.
#
#   west build -b nrf52840dk/nrf52840 --sysbuild -p always . \
#       -- -DEXTRA_CONF_FILE=debug-rtt.conf
#
# Read it with:
#   JLinkRTTLogger -Device nRF52840_xxAA -If SWD -Speed 4000 -RTTChannel 0 out.log
#
# RTT goes over the SWD link, so it works when USB does not - which is exactly
# when you need logs. Note the target only holds ~4 KB of output if no host is
# attached, so start the logger before (or right after) reset to catch boot.

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
