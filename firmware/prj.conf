#
# Smart shelf node - E73-2G4M08S1C (nRF52840), Thread + CoAP
#

# --- Application ------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096

# Empty-shelf raw wandered 2119 counts p-p over 5 minutes (58 samples,
# 2026-08-08, freshly assembled setup) - slow drift, not sample noise, so the
# old 500-count default reported "changes" that were just drift. 2500 counts
# (~17 g at 144852 counts/kg) stays above the observed excursion; every
# heartbeat report (SHELF_HEARTBEAT_IDLE_S 30 s / _ACTIVE_S 10 s) re-bases the
# comparison value, so drift cannot accumulate past it between reports.
# Re-measure after the mechanics have settled for a day - there may be room to
# lower this again.
CONFIG_SHELF_ADC_DELTA_THRESHOLD=2500
# IDLE load cell gate: one 583 ms rail burst (avg 4.8 mA, 10 ohm shunt
# measurement on battery) per interval. The rail duty is the dominant IDLE
# term, so 60 s brings the idle average to ~70 uA (~20 uA radio/system +
# ~47 uA rail) - about a year on 2000 mAh with 8 one-minute sessions a day.
# Change detection while nobody is logged in is delayed by up to this long;
# ACTIVE (0.2 s, rail always on) is unaffected.
CONFIG_SHELF_IDLE_MEASURE_INTERVAL_MS=60000
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_GPIO=y
# Battery voltage via the SAADC VDDH/5 tap (`shelf battery`).
CONFIG_ADC=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# --- Console / logging over the USB-C port ----------------------------------
# The module's UART pins collide with the LED and the CS1237, so everything
# goes over USB CDC ACM. Open the enumerated COM port at any baud rate.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Smart Shelf Node"
CONFIG_USB_DEVICE_MANUFACTURER="SmartShelf"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SHELF_LOG_LEVEL_INF=y

# When USB is not cooperating, build with `-DEXTRA_CONF_FILE=debug-rtt.conf` to
# move the console onto SEGGER RTT, which rides the SWD link instead.

# `ot` and `net` commands are extremely useful for commissioning and field
# debugging.
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_NET_SHELL=y

# --- Networking -------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV6=y

# Do not block boot waiting for an IPv6 address. The default is 30 s, and with
# no border router in range every boot burned all 30 of them before main() ran -
# which also delayed usb_enable(), so the USB console took half a minute to
# appear. The threads already wait for NET_EVENT_L4_CONNECTED themselves, so
# blocking here is redundant. 0 means "do not wait" (init.c:420).
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# --- Thread -----------------------------------------------------------------
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y

# NCS defaults CONFIG_OPENTHREAD_MANUAL_START to y, which means the application
# has to call openthread_start() itself. This one does not - it just waits for
# NET_EVENT_L4_CONNECTED - so the stack stayed down: `ot ifconfig` reported
# `down`, `ot dataset active` reported NotFound, and every credential below was
# ignored in favour of OpenThread's built-in defaults (channel 11, panid 0xffff,
# network name "OpenThread"). Letting the L2 auto-start applies them and brings
# the interface up.
CONFIG_OPENTHREAD_MANUAL_START=n
# Sleepy End Device support. The node boots in IDLE mode (rx off, data poll
# below), and shelf_mode.c flips mRxOnWhenIdle at runtime when the gateway
# commands ACTIVE - see docs/power-modes.md. The old 700 ms LED poll that
# blocked SED (docs/build-and-flash.md §6) is gone: the gateway pushes LED
# state, and the parent queues pushes for the sleeping child.
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=1000
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=8

# Static commissioning. These MUST match the gateway / border router.
# Comment the whole block out and use `ot` shell commands or a joiner instead
# if the gateway hands out credentials.
CONFIG_OPENTHREAD_NETWORK_NAME="SmartShelf"
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_PANID=43981
CONFIG_OPENTHREAD_XPANID="11:11:11:11:22:22:22:22"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"

# --- CoAP -------------------------------------------------------------------
CONFIG_COAP=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=64

# --- 32.768 kHz clock source ------------------------------------------------
# This board has no 32.768 kHz crystal - the module's XL1/XL2 pins are left
# unconnected (confirmed in the pcb-smart-shelf schematic). The nRF52840 DK
# board files assume one, so the internal RC oscillator must be selected
# explicitly.
#
# With XTAL selected and no crystal fitted, LFCLKSTARTED never fires and the
# system clock init blocks forever - the device hangs before main(), so no USB,
# no console, nothing. MCUboot needs the same override (sysbuild/mcuboot.conf).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
